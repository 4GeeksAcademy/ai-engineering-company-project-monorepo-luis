[project]
name = "nexova-operations-api"
version = "0.1.0"
description = "Nexova operations API and supplier directory"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "libpass[bcrypt]>=1.9.3",
    "pydantic>=2.6,<3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "tinydb>=4.8,<5",
    "uvicorn>=0.28.0",
]

[project.scripts]
seed = "seed:main"
promote-admin = "bootstrap_admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seed", "bootstrap_admin"]

[tool.pytest.ini_options]
pythonpath = ["../.."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
