version: "3.9"

services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/website:ro
      - ./uis/backoffice:/app/backoffice:ro
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/api:ro
    env_file:
      - .env.example
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

